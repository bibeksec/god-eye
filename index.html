<script>

function norm(d){if(d.kind=="flow")return ingestFlow(d);if(!live||typeof d.lon!="number"||typeof d.lat!="number")return;const p=[d.lon,d.lat],k=Object.keys(PR).find(k=>inside(p,PR[k]));if(!k)return;
ingest({type:"Feature",geometry:{type:"Point",coordinates:p},properties:{id:d.id||"EV-"+(1000+n++),type:T[d.type]?d.type:"net",prov:k,city:d.city||k,src:d.src||"feed",conf:d.conf??.7,ts:d.ts||Date.now(),sll:d.src_lon!=null?[d.src_lon,d.src_lat]:null}})}

function connect(){if(!WS_URL)return;setMode(false);const w=window.WSK=new WebSocket(WS_URL);w.onopen=()=>setMode(true);w.onclose=()=>{setMode(false);setTimeout(connect,4000)};w.onmessage=m=>{try{const d=JSON.parse(m.data);(Array.isArray(d)?d:[d]).forEach(norm)}catch(e){}}}
function frame(now){arcs=arcs.filter(a=>now-a.t<2300);pulses=pulses.filter(p=>now-p.t<2200);
const A=arcs.map(a=>{const hd=Math.min(1,(now-a.t)/1800),tl=Math.max(0,hd-.4),mx=(a.s[0]+a.d[0])/2,my=(a.s[1]+a.d[1])/2+Math.abs(a.s[1]-a.d[1])*.35+.5,pts=[];
for(let i=0;i<=14;i++){const t=tl+(hd-tl)*i/14,q=1-t;pts.push([q*q*a.s[0]+2*q*t*mx+t*t*a.d[0],q*q*a.s[1]+2*q*t*my+t*t*a.d[1]])}

const P=pulses.map(p=>{const u=(now-p.t)/2200;return{type:"Feature",properties:{c:p.col,r:5+u*45,o:1-u},geometry:{type:"Point",coordinates:p.c}}});
map.getSource("arcs").setData({type:"FeatureCollection",features:A});map.getSource("pulse").setData({type:"FeatureCollection",features:P});requestAnimationFrame(frame)}
function stats(){const now=Date.now(),v=F.filter(f=>!sel||f.properties.prov==sel);$("s1").textContent=F.length;$("s2").textContent=F.filter(f=>now-f.properties.ts<60000).length;$("s3").textContent=F.filter(f=>f.properties.type=="cyber"&&f.properties.conf>.85).length;
const c={};v.forEach(f=>c[f.properties.type]=(c[f.properties.type]||0)+1);$("intel").innerHTML=Object.keys(T).map(k=>`<div style="display:flex;justify-content:space-between"><span style="color:${T[k][1]}">● ${T[k][0]}</span><b>${c[k]||0}</b></div>`).join("");
const by={};F.forEach(f=>by[f.properties.prov]=(by[f.properties.prov]||0)+1);const m=Math.max(...Object.values(by),1),ex=["match",["get","name"]];Object.keys(PR).forEach(k=>ex.push(k,.05+.4*(by[k]||0)/m));ex.push(.05);map.setPaintProperty("pf","fill-opacity",ex)}
async function load(){let fc;if(PROV_URL){try{fc=await(await fetch(PROV_URL)).json()}catch(e){}}
if(!fc)fc={type:"FeatureCollection",features:Object.keys(PR).map(k=>({type:"Feature",properties:{name:k},geometry:{type:"Polygon",coordinates:[PR[k].concat([PR[k][0]])]}}))};
map.addSource("prov",{type:"geojson",data:fc});map.addSource("ev",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
map.addLayer({id:"pf",type:"fill",source:"prov",paint:{"fill-color":"#22d3ee","fill-opacity":.08}});

map.addLayer({id:"heat",type:"heatmap",source:"ev",paint:{"heatmap-weight":["get","conf"],"heatmap-radius":["interpolate",["linear"],["zoom"],5,18,10,50],"heatmap-opacity":.7,"heatmap-color":["interpolate",["linear"],["heatmap-density"],0,"rgba(0,0,0,0)",.3,"rgba(34,211,238,.5)",.6,"rgba(250,204,21,.8)",1,"rgba(255,59,92,.95)"]}});
const col=["match",["get","type"]];Object.keys(T).forEach(k=>col.push(k,T[k][1]));col.push("#fff");
map.addLayer({id:"pts",type:"circle",source:"ev",paint:{"circle-color":col,"circle-radius":["interpolate",["linear"],["zoom"],5,3.5,12,9],"circle-stroke-color":"#fff","circle-stroke-width":1}});
map.addLayer({id:"lbl",type:"symbol",source:"prov",layout:{"text-field":["get","name"],"text-size":12},paint:{"text-color":"#fff","text-halo-color":"#000","text-halo-width":1.5}});
map.addSource("arcs",{type:"geojson",data:{type:"FeatureCollection",features:[]}});map.addSource("pulse",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
map.addLayer({id:"arcs",type:"line",source:"arcs",layout:{"line-cap":"round"},paint:{"line-color":["get","c"],"line-width":3,"line-blur":1.5,"line-opacity":["get","o"]}});
map.addLayer({id:"pulse",type:"circle",source:"pulse",paint:{"circle-color":"rgba(0,0,0,0)","circle-radius":["get","r"],"circle-stroke-color":["get","c"],"circle-stroke-width":2,"circle-stroke-opacity":["get","o"]}});
if(!WS_URL)for(let i=0;i<80;i++)F.push(mk());push();stats();requestAnimationFrame(frame);connect();
map.on("click","pts",e=>{const p=e.features[0].properties;new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${p.id}</b><br>${T[p.type][0]}<br>${p.city}, ${p.prov}<br>Source: ${p.src}<br>Confidence: ${p.conf}<br>Observed: ${new Date(+p.ts).toLocaleTimeString("en-GB",{timeZone:"Asia/Kathmandu"})} NPT<br><i>simulated</i>`).addTo(map)});

tick()}

const dev=id=>DV.find(d=>d.id==id),fmt=b=>b>1e6?(b/1e6).toFixed(1)+" MB":b>1e3?(b/1e3).toFixed(1)+" KB":Math.round(b)+" B";
function audit(a,d){AUD.unshift({ts:Date.now(),a,d:d.id+" "+d.name});if(AUD.length>60)AUD.pop()}
function alertx(key,sev,msg,d){const now=Date.now();if(ALR.some(a=>a.key==key&&now-a.ts<30000))return;ALR.unshift({ts:now,key,sev,msg,dev:d?d.id:"-"});if(ALR.length>60)ALR.pop();
if(d)ingest({type:"Feature",geometry:{type:"Point",coordinates:d.c},properties:{id:"AL-"+(n++),type:"cyber",prov:d.prov,city:d.city,src:"analyzer",conf:.9,ts:now}})}
function ingestFlow(f){f.ts=f.ts||Date.now();const d=dev(f.dev);if(d){d.seen=Date.now();if(d.st=="isolated")alertx("iso"+d.id,"HIGH","Isolated device still sending traffic",d)}FL.push(f);if(FL.length>6000)FL.splice(0,1000)}
function genFlow(){const L=DV.filter(d=>d.st=="online"||d.st=="watch");const d=L[Math.random()*L.length|0];if(!d)return;const r=Math.random();let dp=443,pr="TCP",b=Math.round(Math.exp(6+Math.random()*4));
if(r>.5&&r<.7){dp=53;pr="UDP";b=Math.round(b/8)}else if(r<.8&&r>=.7)dp=80;else if(r<.87&&r>=.8)dp=22;else if(r<.92&&r>=.87){dp=123;pr="UDP"}else if(r>=.92)dp=[8080,1883,3389,5060][Math.random()*4|0];
ingestFlow({ts:Date.now(),dev:d.id,src:d.ip,dst:"198.51.100."+(Math.random()*200|0),sp:49152+(Math.random()*16000|0),dp,proto:pr,bytes:b})}
function inject(){const L=DV.filter(d=>d.st!="isolated"),d=L[Math.random()*L.length|0];if(!d)return;
if(Math.random()<.5){const t="198.51.100."+(Math.random()*200|0);for(let i=0;i<24;i++)ingestFlow({dev:d.id,src:d.ip,dst:t,sp:50000+i,dp:1000+i*7,proto:"TCP",bytes:60})}else for(let i=0;i<30;i++)ingestFlow({dev:d.id,src:d.ip,dst:"198.51.100.77",sp:51000+i,dp:443,proto:"TCP",bytes:900000})}
let S={bins:[],talk:[],proto:{},ports:[],rate:0};
function analyze(){const now=Date.now(),bins=new Array(60).fill(0),tk={},pr={},pt={},last={},base={},scan={};
for(let i=FL.length-1;i>=0;i--){const f=FL[i],a=now-f.ts;if(a>=60000)break;bins[59-(a/1000|0)]+=f.bytes;tk[f.dev]=(tk[f.dev]||0)+f.bytes;pr[f.proto]=(pr[f.proto]||0)+f.bytes;pt[f.dp]=(pt[f.dp]||0)+f.bytes;
if(a<10000){last[f.dev]=(last[f.dev]||0)+f.bytes;const k=f.dev+">"+f.dst;(scan[k]=scan[k]||new Set()).add(f.dp)}else base[f.dev]=(base[f.dev]||0)+f.bytes}
for(const k in last){const l=last[k]/10,b=(base[k]||0)/50;if(l>5000&&l>b*4+3000)alertx("sp"+k,"MED",`Traffic spike ${fmt(l)}/s vs baseline ${fmt(b)}/s`,dev(k))}
for(const k in scan)if(scan[k].size>=12){const d=dev(k.split(">")[0]);alertx("sc"+k,"HIGH",`Port-scan pattern: ${scan[k].size} ports to one target in 10s`,d)}
S={bins,talk:Object.entries(tk).sort((a,b)=>b[1]-a[1]).slice(0,6),proto:pr,ports:Object.entries(pt).sort((a,b)=>b[1]-a[1]).slice(0,6),rate:bins[59]};drawTab()}
const T2=ms=>new Date(ms).toLocaleTimeString("en-GB",{timeZone:"Asia/Kathmandu"});
function drawTab(){const el=$("tb");$("alc").textContent=ALR.length;
if(tab=="traffic"){if(!$("cv")){el.innerHTML='<div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px"><div><div style="color:var(--mu)">THROUGHPUT 60s · <b id="rt"></b>/s</div><canvas id="cv" height="120" style="width:100%"></canvas></div><div id="tt"></div><div id="pp"></div></div>'}
const cv=$("cv"),w=cv.width=cv.clientWidth,h=cv.height,x=cv.getContext("2d"),m=Math.max(...S.bins,1);x.clearRect(0,0,w,h);x.fillStyle="#22d3ee";S.bins.forEach((v,i)=>{const bh=v/m*(h-6);x.fillRect(i*w/60+1,h-bh,w/60-2,bh)});$("rt").textContent=fmt(S.rate);
const tot=Object.values(S.proto).reduce((a,b)=>a+b,0)||1;
$("tt").innerHTML='<div style="color:var(--mu)">TOP TALKERS</div>'+S.talk.map(t=>`<div class="r" onclick="selDev('${t[0]}')"><span>${dev(t[0])?dev(t[0]).name:t[0]}</span><b>${fmt(t[1])}</b></div>`).join("");
$("pp").innerHTML='<div style="color:var(--mu)">PROTOCOLS / PORTS</div>'+Object.entries(S.proto).map(p=>`<div class="r"><span>${p[0]}</span><b>${(p[1]/tot*100).toFixed(0)}%</b></div>`).join("")+S.ports.slice(0,4).map(p=>`<div class="r"><span>port ${p[0]}</span><b>${fmt(p[1])}</b></div>`).join("")}
else if(tab=="devices"){const d=dev(selD),L=DV.map(v=>`<div class="r" onclick="selDev('${v.id}')" style="${v.id==selD?"background:rgba(34,211,238,.15)":""}"><span>${v.id} ${v.name}</span><b style="color:${v.st=="isolated"?"#94a3b8":"#4ade80"}">${v.st}${v.watch?" ★":""}</b></div>`).join("");
const dt=d?`<b>${d.name}</b> · ${d.kind}<br>IP ${d.ip} · ${d.city}, ${d.prov}<br>Tags: ${d.tags.join(", ")||"-"} · seen ${T2(d.seen)}<br>Traffic 60s: ${fmt(FL.filter(f=>f.dev==d.id&&Date.now()-f.ts<60000).reduce((a,f)=>a+f.bytes,0))}<br><div style="margin-top:6px"><button onclick="act('${d.id}','locate')">Locate</button><button onclick="act('${d.id}','watch')">${d.watch?"Unwatch":"Watch"}</button><button onclick="act('${d.id}','tag')">Tag</button><button onclick="act('${d.id}','${d.st=="isolated"?"release":"isolate"}')" style="color:#ff3b5c;border-color:#ff3b5c">${d.st=="isolated"?"Release":"Isolate"}</button></div><small>Commands act on your enrolled agents via the feed connection.</small>`:'<small>Select a device (list or map).</small>';
el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div style="max-height:150px;overflow:auto">${L}</div><div>${dt}</div></div>`}
else if(tab=="alerts")el.innerHTML=ALR.map(a=>`<div class="r"><span>${T2(a.ts)} <b style="color:${a.sev=="HIGH"?"#ff3b5c":"#fb923c"}">${a.sev}</b> ${a.dev} ${a.msg}</span></div>`).join("")||"<small>No alerts yet. Detection: traffic spikes (rate vs 50s baseline), port-scan patterns, isolated device activity.</small>";
else el.innerHTML=AUD.map(a=>`<div class="r"><span>${T2(a.ts)} ${a.a} ${a.d}</span></div>`).join("")||"<small>No actions yet.</small>"}
function setTab(t){tab=t;$("tb").innerHTML="";document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));drawTab()}
function selDev(id){selD=id;setTab("devices")}
function act(id,a){const d=dev(id);if(!d)return;
if(a=="locate")map.flyTo({center:d.c,zoom:11,pitch:45});
if(a=="watch"){d.watch=!d.watch;audit(d.watch?"WATCH":"UNWATCH",d)}
if(a=="tag"){const t=prompt("Tag for "+d.name);if(t){d.tags.push(t);audit("TAG "+t,d)}}
if((a=="isolate"||a=="release")&&confirm(a.toUpperCase()+" "+d.name+" ("+d.ip+")? Only use on devices you own or administer.")){d.st=a=="isolate"?"isolated":"online";audit(a.toUpperCase(),d);if(window.WSK&&WSK.readyState==1)WSK.send(JSON.stringify({cmd:a,device:d.id,by:"bibeksec",ts:Date.now()}))}
refreshDev();drawTab()}
function refreshDev(){const s=map.getSource("dev");if(s)s.setData({type:"FeatureCollection",features:DV.map(d=>({type:"Feature",geometry:{type:"Point",coordinates:d.c},properties:{id:d.id,name:d.name,st:d.st}}))})}
function initDev(){map.addSource("dev",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
map.addLayer({id:"dev",type:"circle",source:"dev",paint:{"circle-radius":7,"circle-color":["match",["get","st"],"isolated","#64748b","#0b1b2b"],"circle-stroke-width":2.5,"circle-stroke-color":["match",["get","st"],"isolated","#94a3b8","#4ade80"]}});
map.on("click","dev",e=>selDev(e.features[0].properties.id));map.on("mouseenter","dev",()=>map.getCanvas().style.cursor="pointer");refreshDev()}
$("up").onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();let a=[];try{if(f.name.endsWith(".json"))a=JSON.parse(t);else{const L=t.trim().split(/\r?\n/),h=L.shift().split(",");a=L.map(l=>{const v=l.split(","),o={};h.forEach((k,i)=>o[k.trim()]=isNaN(+v[i])?v[i]:+v[i]);return o})}}catch(x){alert("Could not parse file");return}
a.forEach(f=>{f.proto=f.proto||"TCP";f.bytes=+f.bytes||0;ingestFlow(f)});audit("IMPORT "+a.length+" flows",{id:"-",name:f.name})};
setInterval(()=>{if(!WS_URL&&live){const k=1+(Math.random()*3|0);for(let i=0;i<k;i++)genFlow();if(Math.random()<.012)inject()}},250);
setInterval(analyze,1000);


/* ===== TERRAIN ===== */
let terrOn=false;
function initTerrain(){
  map.addSource("terr",{type:"raster-dem",tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],tileSize:256,encoding:"terrarium",maxzoom:15});
  try{map.setSky({"sky-color":"#0a1a2a","sky-horizon-blend":0.5,"horizon-color":"#102538","horizon-fog-blend":0.5,"fog-color":"#05090f","fog-ground-blend":0.3});}catch(e){}
}
$("terr").onclick=function(){terrOn=!terrOn;this.classList.toggle("on",terrOn);
  if(terrOn){map.setTerrain({source:"terr",exaggeration:+$("exg").value});if(map.getPitch()<10)map.easeTo({pitch:55,duration:900});}
  else map.setTerrain(null);
};
$("exg").oninput=function(){if(terrOn)map.setTerrain({source:"terr",exaggeration:+this.value});};

/* ===== 3D BUILDINGS (OpenFreeMap vector, no key) ===== */
let bldOn=false;
function initBuildings(){
  map.addSource("ofm",{type:"vector",url:"https://tiles.openfreemap.org/planet"});
  map.addLayer({id:"bld3d",type:"fill-extrusion",source:"ofm","source-layer":"building",minzoom:13,layout:{visibility:"none"},
    paint:{"fill-extrusion-color":"#1b4a68","fill-extrusion-height":["coalesce",["get","render_height"],6],"fill-extrusion-base":["coalesce",["get","render_min_height"],0],"fill-extrusion-opacity":.82}});
}
$("bld").onclick=function(){bldOn=!bldOn;this.classList.toggle("on",bldOn);map.setLayoutProperty("bld3d","visibility",bldOn?"visible":"none");
  if(bldOn&&map.getZoom()<13)map.easeTo({zoom:13.5,duration:800});};

/* ===== LIVE AIRSPACE (OpenSky public ADS-B) ===== */
let flyTimer=null;
function initFlights(){
  map.addSource("fly",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"fly",type:"symbol",source:"fly",layout:{visibility:"none","text-field":"✈","text-size":17,"text-rotate":["get","hdg"],"text-rotation-alignment":"map","text-allow-overlap":true,"text-ignore-placement":true},paint:{"text-color":"#eab308","text-halo-color":"#000","text-halo-width":1}});
  map.on("click","fly",e=>{const p=e.features[0].properties;new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${p.cs||"unknown"}</b><br>${p.country||""}<br>Alt: ${p.alt?Math.round(p.alt)+" m":"-"}<br>Speed: ${p.spd?Math.round(p.spd*3.6)+" km/h":"-"}<br><i>Live public ADS-B (OpenSky)</i>`).addTo(map)});
  map.on("mouseenter","fly",()=>map.getCanvas().style.cursor="pointer");map.on("mouseleave","fly",()=>map.getCanvas().style.cursor="");
}
async function pollFlights(){
  if(!$("flyOn").checked)return;
  try{
    const r=await fetch("https://opensky-network.org/api/states/all?lamin=26.2&lomin=79.9&lamax=30.6&lomax=88.3");
    const d=await r.json();const st=d.states||[];
    const feats=st.filter(s=>s[5]&&s[6]).map(s=>({type:"Feature",geometry:{type:"Point",coordinates:[s[5],s[6]]},properties:{cs:(s[1]||"").trim(),country:s[2],alt:s[7],spd:s[9],hdg:s[10]||0}}));
    map.getSource("fly").setData({type:"FeatureCollection",features:feats});$("flyc").textContent=feats.length;
  }catch(e){$("flyc").textContent="—";}
}
$("flyOn").onchange=function(){map.setLayoutProperty("fly","visibility",this.checked?"visible":"none");if(this.checked){pollFlights();if(!flyTimer)flyTimer=setInterval(pollFlights,12000);}};

/* ===== FLEET (your own tracked vehicles — simulated unless fed via WS_URL) ===== */
const FLEET=CITY.slice(0,6).map((c,i)=>({id:"VEH-"+String(i+1).padStart(2,"0"),name:"unit-"+c[0].slice(0,3).toLowerCase(),c:[c[1],c[2]],hdg:Math.random()*360,spd:0.0006+Math.random()*0.0008,t:Math.random()*Math.PI*2}));
function initFleet(){
  map.addSource("fleet",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"fleet",type:"symbol",source:"fleet",layout:{"text-field":"▲","text-size":14,"text-rotate":["get","hdg"],"text-rotation-alignment":"map","text-allow-overlap":true},paint:{"text-color":"#4ade80","text-halo-color":"#000","text-halo-width":1}});
  map.on("click","fleet",e=>{const p=e.features[0].properties;new maplibregl.Popup().setLngLat(e.lngLat).setHTML(`<b>${p.id}</b> ${p.name}<br>Heading ${Math.round(p.hdg)}°<br><i>Simulated fleet — replace with real GPS feed via WS_URL</i>`).addTo(map)});
}
function stepFleet(){
  FLEET.forEach(v=>{v.t+=v.spd;v.c=[v.c[0]+Math.cos(v.t)*0.0009,v.c[1]+Math.sin(v.t*1.3)*0.0007];v.hdg=(v.hdg+ (Math.random()-.5)*6+360)%360;});
  map.getSource("fleet")&&map.getSource("fleet").setData({type:"FeatureCollection",features:FLEET.map(v=>({type:"Feature",geometry:{type:"Point",coordinates:v.c},properties:{id:v.id,name:v.name,hdg:v.hdg}}))});
  $("fltc").textContent=FLEET.length;
}
$("fleetOn").onchange=function(){map.setLayoutProperty("fleet","visibility",this.checked?"visible":"none")};

map.on("load",()=>{load();initDev();initTerrain();initBuildings();initFlights();initFleet();pollFlights();setInterval(stepFleet,900);});
</script></body></html>
